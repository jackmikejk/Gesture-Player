# Publishes the site and stamps each deploy with a build id,
# so installed Home Screen apps can tell when a newer version is live.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        run: |
          V="${GITHUB_SHA::7}"
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          sed -i "s/__BUILD__/$V/g" _site/index.html _site/app.js
          printf '{"v":"%s"}\n' "$V" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
